<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mindmap Editor</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script type="module" src="modules/main.js"></script>
  <style id="pg"></style>
</head>

<body>
  <div id="bar">
    <button id="bFit">Ajustar<img src="icons/fit.svg"></button>
    <div class="bar-right">
      <button id="bJson"><img src="icons/json.svg"></button>
      <button id="bPdf" class="pri"><img src="icons/pdf.svg"></button>
      <button id="bNew">Nova árvore<img src="icons/create.svg"></button>
    </div>
  </div>

  <div id="view" tabindex="-1">
    <div id="stage"><svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <dialog id="dlg">
    <div class="head">
      <span id="msg"></span>
      <button id="bClose"><img src="icons/close.svg"></button>
    </div>

    <textarea id="ta" spellcheck="false" readonly></textarea>

    <div class="row">
      <button id="bCopy">Copiar</button>
      <button id="bLoad" class="pri">Carregar JSON</button>
    </div>
  </dialog>

  <div id="menu" hidden>
    <button data-act="child">Criar filho</button>
    <button data-act="sibling">Criar irmão</button>
    <button data-act="delete">Excluir membro</button>
  </div>
</body>

</html>
